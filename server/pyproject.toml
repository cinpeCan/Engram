[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-gateway"
version = "0.1.1"
description = "FastAPI gateway for Engram cloud SSE distillation, cited GraphRAG answers, Bearer quota enforcement, and multi-device LWW sync"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "google-genai>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "jsonschema>=4.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
